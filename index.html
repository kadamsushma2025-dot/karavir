<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        
        <style>
            /* Full Screen Map CSS */
            html, body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                overflow: hidden;
                background-color: #ffffff;
            }

            #map {
                width: 100vw;
                height: 100vh;
                padding: 0;
                margin: 0;
            }

            .ol-control > * {
                background-color: #f8f8f8!important;
                color: #444444!important;
                border-radius: 0px;
            }
            .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
                color: #444444!important;
            }
            .search-layer-input-search {
                background-color: #f8f8f8!important;
            }
            .ol-control > *:focus, .ol-control >*:hover {
                background-color: rgba(248, 248, 248, 0.7)!important;
            } 
            .ol-control {
                background-color: rgba(255,255,255,.4) !important;
                padding: 2px !important;
            } 

            /* Map Title Style */
            .map-title {
                position: absolute;
                top: 15px;
                left: 60px;
                z-index: 1000;
                background-color: rgba(255, 255, 255, 0.9);
                padding: 8px 15px;
                border-radius: 5px;
                font-family: Arial, sans-serif;
                font-size: 20px;
                font-weight: bold;
                color: #333;
                box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            }

            /* North Arrow Style */
            .north-arrow {
                position: absolute;
                top: 15px;
                right: 15px;
                z-index: 1000;
                background-color: rgba(255, 255, 255, 0.9);
                padding: 5px;
                border-radius: 5px;
                text-align: center;
                box-shadow: 0 2px 5px rgba(0,0,0,0.3);
                font-family: Arial, sans-serif;
                font-weight: bold;
                font-size: 14px;
            }
            .north-arrow img {
                width: 30px;
                height: 30px;
                display: block;
                margin: 0 auto;
            }
        </style>
    </head>
    <body>
        <!-- Map Title -->
        <div class="map-title">Karvir Map</div>

        <!-- North Arrow -->
        <div class="north-arrow">
            <img src="https://cdn-icons-png.flaticon.com/512/618/618035.png" alt="North Arrow">
            N
        </div>

        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/karvir_clipclipped_2.js"></script><script src="layers/building_3.js"></script><script src="layers/contour_4.js"></script><script src="layers/landuse_5.js"></script><script src="layers/Railway_6.js"></script><script src="layers/roads_7.js"></script><script src="layers/water_8.js"></script>
        <script src="styles/karvir_clipclipped_2_style.js"></script><script src="styles/building_3_style.js"></script><script src="styles/contour_4_style.js"></script><script src="styles/landuse_5_style.js"></script><script src="styles/Railway_6_style.js"></script><script src="styles/roads_7_style.js"></script><script src="styles/water_8_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>

        <!-- Scale Line & Window Resize Script -->
        <script>
            // Add Scale Line Control
            var scaleLineControl = new ol.control.ScaleLine({
                units: 'metric',
                bar: false,
                steps: 4,
                text: true,
                minWidth: 100
            });
            map.addControl(scaleLineControl);

            // Auto Resize Map on Window Size Change
            window.addEventListener('resize', function() {
                map.updateSize();
            });
        </script>
    </body>
</html>
